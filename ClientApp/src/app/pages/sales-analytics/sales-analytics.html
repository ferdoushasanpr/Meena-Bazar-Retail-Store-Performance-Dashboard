<div class="container">
    <!-- Top Navigation Header -->
    <app-page-header [title]="pageHeaderTitle" [subtitle]="pageHeaderSubtitle"
        (exportReport)="exportConsolidatedReport()" />

    <!-- Filter Control Bar -->
    <section class="filter-bar">
        <div class="time-pills">
            @for (range of timeRanges; track range) {
            <button class="pill-btn" [class.active]="selectedTimeRange === range" (click)="setTimeRange(range)">
                {{ range }}
            </button>
            }
        </div>

        @if (selectedTimeRange === 'Select Range') {
        <div class="custom-date-range">
            <label>
                Start:
                <input type="date" [ngModel]="customStartDate()"
                    (ngModelChange)="customStartDate.set($event); onCustomDateChange()" />
            </label>

            <label>
                End:
                <input type="date" [ngModel]="customEndDate()"
                    (ngModelChange)="customEndDate.set($event); onCustomDateChange()" />
            </label>
        </div>
        }

        <div class="filter-controls">
            <div class="store-filter">
                <i class="fa-solid fa-store"></i>

                <select [ngModel]="selectedStore()" (ngModelChange)="onStoreChange($event)">
                    <option value="All Stores">All Stores</option>
                    @for (store of storesArr(); track $index) {
                    <option [value]="store.store_id">
                        {{ store.store_name }} ({{ store.city }})
                    </option>
                    }
                </select>
            </div>

            <button class="btn-text" (click)="onResetFilter()">
                <i class="fa-solid fa-arrow-rotate-left"></i>
                Reset Filters
            </button>

        </div>
    </section>

    <!-- Metric Cards Grid (4 Columns) -->
    <section class="metrics-grid">
        <!-- Card 1: Total Sales -->
        <app-metric-card [card]="totalSalesCard()" />

        <!-- Card 2: Transactions -->
        <app-metric-card [card]="transactionsCard()" />

        <!-- Card 3: Avg. Basket Value -->
        <app-metric-card [card]="averageBasketCard()" />

        <!-- Card 4: Avg Daily Sales -->
        <app-metric-card [card]="avgDailySalesCard()" />
    </section>

    <div class="charts-section">
        <app-trend-chart [dailyStoreData]="dailyStoreSalesData()" [showControls]="false" />
        <!-- Vertical Bar Chart with Store Selector -->
        <app-vertical-bar-chart title="Category Sales Performance"
            subtitle="Revenue and volume performance per category" [data]="filteredStoreCategorySalesData()" />
    </div>
</div>
