<div class="container">
    <!-- Top Navigation Header -->
    <app-page-header [title]="pageHeaderTitle" [subtitle]="pageHeaderSubtitle" />

    <!-- Filter Control Bar -->
    <section class="filter-bar">
        <div class="time-pills">
            @for (range of timeRanges; track range) {
            <button class="pill-btn" [class.active]="selectedTimeRange === range" (click)="setTimeRange(range)">
                {{ range }}
            </button>
            }
        </div>

        @if (selectedTimeRange === 'Select Range') {
        <div class="custom-date-range">
            <label>
                Start:
                <input type="date" [ngModel]="customStartDate()"
                    (ngModelChange)="customStartDate.set($event); onCustomDateChange()" />
            </label>
            <label>
                End:
                <input type="date" [ngModel]="customEndDate()"
                    (ngModelChange)="customEndDate.set($event); onCustomDateChange()" />
            </label>
        </div>
        }

        <div class="filter-controls">
            <button class="btn-text">
                <i class="fa-solid fa-arrow-rotate-left"></i> Reset Filters
            </button>
        </div>
    </section>

    <!-- Metric Cards Grid (4 Columns) -->
    <section class="metrics-grid">
        <!-- Card 1: Total Sales -->
        <app-metric-card [card]="totalSalesCard()" />

        <!-- Card 2: Transactions -->
        <app-metric-card [card]="transactionsCard()" />

        <!-- Card 3: Avg. Basket Value -->
        <app-metric-card [card]="averageBasketCard()" />

        <!-- Card 4: Avg Daily Sales -->
        <app-metric-card [card]="avgDailySalesCard()" />
    </section>

    <app-horizontal-bar-chart [data]="storesSalesData()" labelKey="store_name" salesKey="total_Sales" />

    <app-table-chart title="Store Category Performance"
        subtitle="Breakdown by store, category, sales volume, and transaction count"
        [data]="storeCategorySalesData().data" [pageNumber]="storeCategorySalesData().pageNumber"
        [pageSize]="storeCategorySalesData().pageSize" [totalRecords]="storeCategorySalesData().totalRecords"
        [totalPages]="storeCategorySalesData().totalPages" [hasPreviousPage]="storeCategorySalesData().hasPreviousPage"
        [hasNextPage]="storeCategorySalesData().hasNextPage" (pageChange)="onPageChange($event)" />
</div>
