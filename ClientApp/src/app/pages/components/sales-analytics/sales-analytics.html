<div class="container">
    <!-- Top Navigation Header -->
    <app-page-header [title]="pageHeaderTitle" [subtitle]="pageHeaderSubtitle"
        (exportReport)="exportConsolidatedReport()" />

    <!-- Filter Control Bar -->
    <app-filter (filterCriteria)="loadCurrentFilter($event)" />

    @if (isLoading()) {
    <div class="loading-error-container">
        <app-loading message="Fetching records..." />
    </div>
    } @else if (hasError()) {
    <div class="loading-error-container">
        <app-error-display [message]="salesAnalyticsErrorMessage() ?? 'Unable to Load Data. Please Try Again.'"
            (onLoad)="loadSalesData()" />
    </div>
    } @else {
    <!-- Metric Cards Grid (4 Columns) -->
    <section class="metrics-grid">
        <!-- Card 1: Total Sales -->
        <app-metric-card [card]="totalSalesCard()" />

        <!-- Card 2: Transactions -->
        <app-metric-card [card]="transactionsCard()" />

        <!-- Card 3: Avg. Basket Value -->
        <app-metric-card [card]="averageBasketCard()" />

        <!-- Card 4: Avg Daily Sales -->
        <app-metric-card [card]="avgDailySalesCard()" />
    </section>

    <div class="charts-section">
        <!-- Sales Trend Chart -->
        <app-trend-chart [dailyStoreData]="dailyStoreSalesData()" [showControls]="false" />
        <!-- Category Donut Chart -->
        <app-donut-chart class="donut-chart" [data]="filteredStoreCategorySalesData()" [salesData]="salesKpiData()">
        </app-donut-chart>
    </div>
    <app-table-chart title="Store Product Performance"
        subtitle="Breakdown by store, product, sales volume, and transaction count" [data]="paginatedSalesData().data"
        [pageNumber]="paginatedSalesData().pageNumber" [pageSize]="paginatedSalesData().pageSize"
        [totalRecords]="paginatedSalesData().totalRecords" [totalPages]="paginatedSalesData().totalPages"
        [hasPreviousPage]="paginatedSalesData().hasPreviousPage" [hasNextPage]="paginatedSalesData().hasNextPage"
        (pageChange)="onPageChange($event)" />
    }
</div>
