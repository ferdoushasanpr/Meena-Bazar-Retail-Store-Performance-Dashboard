<div class="container">
    <!-- Top Navigation Header -->
    <app-page-header [title]="pageHeaderTitle" [subtitle]="pageHeaderSubtitle" [isReport]="true"
        (exportReport)="exportConsolidatedReport()" />

    <!-- Filter Control Bar -->
    <app-filter [isStoreFilter]="false" (filterCriteria)="loadCurrentFilter($event)" />

    @if (isLoading()) {
    <div class="loading-error-container">
        <app-loading message="Fetching records..." />
    </div>
    } @else if (hasError()) {
    <div class="loading-error-container">
        <app-error-display [message]="productCategoriesErrorMessage() ?? 'Unable to Load Data. Please Try Again.'"
            (onLoad)="loadSalesData()" />
    </div>
    } @else {
    <div class="charts-section">
        <!-- Vertical Bar Chart with Store Selector -->
        <app-vertical-bar-chart title="Category Sales Performance"
            subtitle="Revenue and volume performance per category" [data]="salesCategoryData()" labelKey="category" />

        <div class="charts-row">
            <!-- Store Sales Breakdown -->
            <app-donut-chart class="donut-chart" [data]="storesSalesData()">
            </app-donut-chart>

            <!-- Product Sales -->
            <app-horizontal-bar-chart [data]="productSalesData()" labelKey="product_name" salesKey="total_Sales"
                (pageChange)="onHorizontalBarChartPageChange($event)" />
        </div>

        <app-table-chart title="Store Category Performance"
            subtitle="Breakdown by store, category, sales volume, and transaction count"
            [data]="storeCategorySalesData().data" [pageNumber]="storeCategorySalesData().pageNumber"
            [pageSize]="storeCategorySalesData().pageSize" [totalRecords]="storeCategorySalesData().totalRecords"
            [totalPages]="storeCategorySalesData().totalPages"
            [hasPreviousPage]="storeCategorySalesData().hasPreviousPage"
            [hasNextPage]="storeCategorySalesData().hasNextPage" (pageChange)="onTableChartPageChange($event)" />
    </div>
    }
</div>
