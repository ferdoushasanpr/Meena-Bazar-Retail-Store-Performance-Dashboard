<div class="dashboard-container">
    <!-- Page Header -->
    <app-page-header [title]="pageHeaderTitle" [subtitle]="pageHeaderSubtitle"
        (exportReport)="exportConsolidatedReport()">
    </app-page-header>

    <!-- Metric Cards -->
    <section class="metrics-grid">
        <app-metric-card class="metric-item" [card]="totalSalesCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="transactionsCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="averageBasketCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="avgDailySalesCard()">
        </app-metric-card>
    </section>

    <!-- Charts Section -->
    <section class="charts-section">
        <!-- Trend Chart -->
        <app-trend-chart class="trend-chart" [dailyData]="dailySalesData()" [monthlyData]="monthlySalesData()"
            [yearlyData]="yearlySalesData()">
        </app-trend-chart>

        <!-- Brand Sales Chart -->
        <app-horizontal-bar-chart class="bar-chart" [data]="brandSalesData()" labelKey="brand" salesKey="total_Sales">
        </app-horizontal-bar-chart>

        <!-- Category Donut Chart -->
        <app-donut-chart class="donut-chart" [data]="salesCategoryData()" [salesData]="salesKpiData()">
        </app-donut-chart>
    </section>
</div>
