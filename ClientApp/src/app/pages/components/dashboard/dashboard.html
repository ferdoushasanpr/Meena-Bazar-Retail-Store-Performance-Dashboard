<div class="dashboard-container">
    <!-- Page Header -->
    <app-page-header [title]="pageHeaderTitle" [subtitle]="pageHeaderSubtitle"
        (exportReport)="exportConsolidatedReport()">
    </app-page-header>

    @if (isLoading()) {
    <div class="loading-error-container">
        <app-loading message="Fetching records..." />
    </div>
    } @else if (hasError()) {
    <div class="loading-error-container">
        <app-error-display [message]="dashboardErrorMessage() ?? 'Unable to Load Data. Please Try Again.'"
            (onLoad)="onLoadComponent()" />
    </div>
    } @else {
    <!-- Metric Cards -->
    <section class="metrics-grid">
        <app-metric-card class="metric-item" [card]="totalCustomerCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="totalProductCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="totalStoreCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="totalOrderCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="totalSalesCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="transactionsCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="averageBasketCard()">
        </app-metric-card>

        <app-metric-card class="metric-item" [card]="avgDailySalesCard()">
        </app-metric-card>
    </section>

    <!-- Charts Section -->
    <section class="charts-section">
        <!-- Trend Chart: Full Width -->
        <app-trend-chart class="trend-chart" [dailyData]="dailySalesData()" [monthlyData]="monthlySalesData()"
            [yearlyData]="yearlySalesData()">
        </app-trend-chart>

        <!-- Product Sales Chart -->
        <app-horizontal-bar-chart class="product-chart" [data]="productSalesData()" labelKey="product_name"
            salesKey="total_Sales" (pageChange)="onPageChange($event)" />

        <!-- Category Donut Chart -->
        <app-donut-chart class="donut-chart" [data]="salesCategoryData()" [salesData]="salesKpiData()">
        </app-donut-chart>

        <!-- Brand Sales Chart: Full Width -->
        <app-horizontal-bar-chart class="bar-chart" [data]="brandSalesData()" labelKey="brand" salesKey="total_Sales">
        </app-horizontal-bar-chart>
    </section>
    }
</div>
