<div class="container">
    <!-- Top Navigation Header -->
    <app-page-header [title]="pageHeaderTitle()" [subtitle]="pageHeaderSubtitle()" />

    <app-dynamic-table [title]="tableHeader().title" [subtitle]="tableHeader().subtitle" [data]="componentData().data"
        [pageNumber]="componentData().pageNumber" [pageSize]="componentData().pageSize"
        [totalRecords]="componentData().totalRecords" [totalPages]="componentData().totalPages"
        [hasPreviousPage]="componentData().hasPreviousPage" [hasNextPage]="componentData().hasNextPage"
        (pageChange)="onPageChange($event)" (updateRow)="handleUpdate($event)" (deleteRow)="handleDelete($event)"
        (searchTerm)="onSearch($event)" />

    <app-modal-form [isOpen]="isModalOpen()" [entityType]="activeEntityType()" [initialData]="selectedRowData()"
        (closeModal)="handleCloseModal()" (saveData)="handleSaveUpdate($event)" />

    <app-dialog-box [isOpen]="isDeleteModalOpen()" title="Delete Item" [itemName]="itemToDelete()?.order_item_id"
        message="Are you sure you want to delete this item record?" (closeModal)="onCloseDeleteModal()"
        (confirmDelete)="onConfirmDelete()" />
</div>
