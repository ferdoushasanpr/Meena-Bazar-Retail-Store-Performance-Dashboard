<div class="container">
    <!-- Top Navigation Header -->
    <app-page-header [title]="pageHeaderTitle" [subtitle]="pageHeaderSubtitle" />

    <app-dynamic-table title="Transactions" subtitle="Breakdown by order, product, quantity, and amount"
        [data]="transactions().data" [pageNumber]="transactions().pageNumber" [pageSize]="transactions().pageSize"
        [totalRecords]="transactions().totalRecords" [totalPages]="transactions().totalPages"
        [hasPreviousPage]="transactions().hasPreviousPage" [hasNextPage]="transactions().hasNextPage"
        (pageChange)="onPageChange($event)" (updateRow)="handleUpdate($event)" (deleteRow)="handleDelete($event)" />
</div>
