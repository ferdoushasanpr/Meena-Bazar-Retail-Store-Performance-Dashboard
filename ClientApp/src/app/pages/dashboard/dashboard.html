<div class="dashboard-container">
    <!-- Top Navigation Header -->
    <header class="dashboard-header">
        <div class="header-title">
            <div class="title-row">
                <h1>Sales Overview</h1>
                <span class="badge-tag">EXECUTIVE REGIONAL</span>
            </div>
            <p class="subtitle">Monitor revenue, transactions, and retail performance across your stores.</p>
        </div>

        <div class="header-actions">
            <div class="last-updated">
                <span class="status-dot"></span>
                <span>Last updated: <strong>10:42 AM</strong></span>
                <button class="icon-btn" title="Refresh Data"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <button class="btn btn-outline">
                <i class="fa-solid fa-cloud-arrow-down"></i> Export Summary
            </button>
        </div>
    </header>

    <!-- Filter Control Bar -->
    <section class="filter-bar">
        <div class="time-pills">
            @for (range of timeRanges; track range) {
            <button class="pill-btn" [class.active]="selectedTimeRange === range" (click)="setTimeRange(range)">
                {{ range }}
            </button>
            }
        </div>

        <div class="filter-controls">
            <button class="btn btn-dropdown">
                <i class="fa-solid fa-store"></i>
                <span><strong>{{ selectedStoresCount }} Stores Selected</strong> <small>{{ selectedStoresCount }}/{{
                        totalStoresCount }}</small></span>
                <i class="fa-solid fa-chevron-down"></i>
            </button>

            <label class="checkbox-label">
                <input type="checkbox" [(ngModel)]="compareChecked">
                <span>Compare: <strong>Prev Period (30d)</strong></span>
            </label>

            <button class="btn-text">
                <i class="fa-solid fa-arrow-rotate-left"></i> Reset Filters
            </button>
        </div>
    </section>

    <!-- Metric Cards Grid (4 Columns) -->
    <section class="metrics-grid">
        <!-- Card 1: Total Sales -->
        <app-metric-card [card]="totalSalesCard()" />

        <!-- Card 2: Transactions -->
        <app-metric-card [card]="transactionsCard()" />

        <!-- Card 3: Avg. Basket Value -->
        <app-metric-card [card]="averageBasketCard()" />

        <!-- Card 4: Avg Daily Sales -->
        <app-metric-card [card]="avgDailySalesCard" />
    </section>

    <!-- Charts Layout (2 Columns) -->
    <section class="charts-section">
        <!-- Left Chart: Sales Performance Trend -->
        <app-trend-chart [dailyData]="dailySalesData()" [monthlyData]="monthlySalesData()" />

        <!-- Right Chart: Sales by Category -->
        <app-donut-chart [data]="salesCategoryData()" [salesData]="salesKpiData()" />
    </section>
    <app-horizontal-bar-chart />
</div>
