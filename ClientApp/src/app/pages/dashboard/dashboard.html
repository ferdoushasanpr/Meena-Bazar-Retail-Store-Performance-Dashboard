<div class="dashboard-container">
    <!-- Top Navigation Header -->
    <app-page-header [title]="pageHeaderTitle" [subtitle]="pageHeaderSubtitle" />

    <!-- Metric Cards Grid (4 Columns) -->
    <section class="metrics-grid">
        <!-- Card 1: Total Sales -->
        <app-metric-card [card]="totalSalesCard()" />

        <!-- Card 2: Transactions -->
        <app-metric-card [card]="transactionsCard()" />

        <!-- Card 3: Avg. Basket Value -->
        <app-metric-card [card]="averageBasketCard()" />

        <!-- Card 4: Avg Daily Sales -->
        <app-metric-card [card]="avgDailySalesCard" />
    </section>

    <!-- Charts Layout (2 Columns) -->

    <section class="charts-section">
        <!-- Left column: Trend chart -->
        <app-trend-chart class="trend-chart" [dailyData]="dailySalesData()" [monthlyData]="monthlySalesData()" />

        <!-- Right column: Donut chart spanning both rows -->
        <app-donut-chart class="donut-chart" [data]="salesCategoryData()" [salesData]="salesKpiData()" />
    </section>
</div>
