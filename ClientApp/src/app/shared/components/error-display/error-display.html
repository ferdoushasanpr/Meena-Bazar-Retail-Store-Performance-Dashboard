<div class="error-container">
    <div class="error-icon">
        <i class="fa-solid fa-circle-exclamation"></i>
    </div>
    <h3>Something went wrong!</h3>
    <p>{{ message() }}</p>
    <button (click)="onLoadComponent()">
        <i class="fa-solid fa-arrow-rotate-right"></i>
        Try Again
    </button>
</div>
