<header class="topbar-wrapper">
    <div class="topbar-row">
        <div class="left-group">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <span class="breadcrumb-parent">Overview</span>
                @for (path of pathSegments(); track $index) {
                <span class="breadcrumb-divider">/</span>
                <a [routerLink]="'/' + path" class="breadcrumb-current" [attr.aria-current]="$last ? 'page' : null">

                    {{ path.replaceAll('-', ' ') | titlecase }}
                </a>
                }
            </nav>

            <div class="vertical-divider"></div>
            <div class="status-indicator">
                <span class="blue-dot"></span>
                <span class="status-text">Updated 2m ago</span>
            </div>
        </div>

        <!-- Right: Actions -->
        <div class="right-group">
            <!-- Notifications -->
            <div class="notification-wrapper" style="position: relative;">
                <button class="icon-btn" type="button" aria-label="Notifications" (click)="toggleNotifications()">
                    <i class="fa-regular fa-bell"></i>
                    @if (notifications().filter((item) => !item.isRead).length > 0) {
                    <span class="bell-dot"></span>
                    }
                </button>

                <app-notification-panel [isOpen]="isNotificationsOpen()" [notifications]="notifications()"
                    (markAsRead)="updateMarkAsRead($event)" (closePanel)="isNotificationsOpen.set(false)">
                </app-notification-panel>
            </div>
            <!-- Export -->
            <button class="btn-action" type="button" (click)="onLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>
</header>
