<header class="topbar-wrapper">
    <div class="topbar-row">
        <div class="left-group">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <span class="breadcrumb-parent">Overview</span>
                @for (path of pathSegments(); track $index) {
                <span class="breadcrumb-divider">/</span>
                <a [routerLink]="'/' + path" class="breadcrumb-current" [attr.aria-current]="$last ? 'page' : null">

                    {{ path.replaceAll('-', ' ') | titlecase }}
                </a>
                }
            </nav>

            <div class="vertical-divider"></div>
            <div class="status-indicator">
                <span class="blue-dot"></span>
                <span class="status-text">Updated 2m ago</span>
            </div>
        </div>

        <!-- Right: Actions -->
        <div class="right-group">
            <!-- Notifications -->
            <button class="icon-btn" type="button" aria-label="Notifications">
                <i class="fa-regular fa-bell"></i>
                <span class="bell-dot"></span>
            </button>
            <!-- Export -->
            <button class="btn-action" type="button" (click)="onLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>
</header>
