<header class="dashboard-header">
    <div class="header-title">
        <div class="title-row">
            <h1>{{ title() }}</h1>

            <span class="badge-tag">
                EXECUTIVE REGIONAL
            </span>
        </div>

        <p class="subtitle">
            {{ subtitle() }}
        </p>
    </div>

    <div class="header-actions">
        <div class="last-updated">
            <span class="status-dot"></span>

            <span class="updated-text">
                Last active: <strong>{{ userData().user_last_active_at | date:'dd MMM yyyy, hh:mm a' }}</strong>
            </span>

            <button class="icon-btn" type="button" title="Refresh Data" aria-label="Refresh Data"
                (click)="onRefreshPage()">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        @if (isReport()) {
        <button class="btn btn-outline" type="button" (click)="onExportReport()">
            <i class="fa-solid fa-cloud-arrow-down"></i>
            <span>Export CSV Report</span>
        </button>
        }
    </div>
</header>
